<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- 极光背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31104b" />
    </linearGradient>

    <!-- 极光发光环渐变 -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="30%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- 立体水晶核心渐变 -->
    <linearGradient id="coreGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#a5b4fc" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0.9" />
    </linearGradient>

    <!-- 文字发光渐变 -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- 滤镜与辉光 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
    </filter>
  </defs>

  <!-- 背景深空圆形 -->
  <circle cx="100" cy="100" r="94" fill="url(#bgGrad)" />

  <!-- 外部呼吸光晕 -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#ringGrad)" stroke-width="6" opacity="0.6" filter="url(#softGlow)" />
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="450 130" />

  <!-- 内层科技轨道微环 -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="4 6" opacity="0.4" />

  <!-- 3D 几何水晶晶体多面体 -->
  <polygon points="100,28 152,58 152,118 100,148 48,118 48,58" fill="url(#coreGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />
  <polygon points="100,28 100,148 48,118 48,58" fill="rgba(99,102,241,0.2)" />
  <polygon points="100,28 152,58 100,90 48,58" fill="rgba(255,255,255,0.25)" />
  <polygon points="100,90 152,118 100,148 48,118" fill="rgba(168,85,247,0.25)" />

  <!-- 科技光点 -->
  <circle cx="100" cy="28" r="3" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="152" cy="58" r="2.5" fill="#a855f7" filter="url(#glow)" />
  <circle cx="152" cy="118" r="2.5" fill="#ec4899" filter="url(#glow)" />
  <circle cx="48" cy="118" r="2.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="48" cy="58" r="2.5" fill="#818cf8" filter="url(#glow)" />

  <!-- 居中精美品牌字符 “神” -->
  <text x="100" y="108" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="52" font-weight="900" text-anchor="middle" dominant-baseline="middle" fill="url(#textGrad)" filter="url(#glow)" letter-spacing="1">神</text>

  <!-- 底部微标 -->
  <text x="100" y="172" font-family="'JetBrains Mono', Consolas, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#94a3b8" letter-spacing="3">LISHEN.DEV</text>
</svg>
