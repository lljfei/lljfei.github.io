<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="450" fill="url(#bg)" />

  <!-- 点阵网格 -->
  <g opacity="0.15">
    <circle cx="100" cy="80" r="1.5" fill="#38bdf8" />
    <circle cx="200" cy="80" r="1.5" fill="#38bdf8" />
    <circle cx="300" cy="80" r="1.5" fill="#38bdf8" />
    <circle cx="400" cy="80" r="1.5" fill="#38bdf8" />
    <circle cx="500" cy="80" r="1.5" fill="#38bdf8" />
    <circle cx="600" cy="80" r="1.5" fill="#38bdf8" />
    <circle cx="700" cy="80" r="1.5" fill="#38bdf8" />
    <circle cx="100" cy="180" r="1.5" fill="#38bdf8" />
    <circle cx="200" cy="180" r="1.5" fill="#38bdf8" />
    <circle cx="600" cy="180" r="1.5" fill="#38bdf8" />
    <circle cx="700" cy="180" r="1.5" fill="#38bdf8" />
    <circle cx="100" cy="280" r="1.5" fill="#38bdf8" />
    <circle cx="200" cy="280" r="1.5" fill="#38bdf8" />
    <circle cx="600" cy="280" r="1.5" fill="#38bdf8" />
    <circle cx="700" cy="280" r="1.5" fill="#38bdf8" />
    <circle cx="100" cy="380" r="1.5" fill="#38bdf8" />
    <circle cx="200" cy="380" r="1.5" fill="#38bdf8" />
    <circle cx="300" cy="380" r="1.5" fill="#38bdf8" />
    <circle cx="400" cy="380" r="1.5" fill="#38bdf8" />
    <circle cx="500" cy="380" r="1.5" fill="#38bdf8" />
    <circle cx="600" cy="380" r="1.5" fill="#38bdf8" />
    <circle cx="700" cy="380" r="1.5" fill="#38bdf8" />
  </g>

  <!-- 神经智能流与节点 -->
  <path d="M 120 225 Q 260 120 400 225 T 680 225" fill="none" stroke="url(#cyberGrad)" stroke-width="3" filter="url(#glow)" />
  <path d="M 160 270 Q 300 360 440 250 T 640 180" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="6 8" opacity="0.6" />

  <!-- 核心 Agent 智能体节点 -->
  <g transform="translate(400, 225)">
    <circle r="55" fill="none" stroke="url(#cyberGrad)" stroke-width="2" opacity="0.4" />
    <circle r="42" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" filter="url(#glow)" />
    <!-- 智能晶体 -->
    <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="url(#cyberGrad)" opacity="0.85" />
    <circle r="6" fill="#ffffff" filter="url(#glow)" />
  </g>

  <!-- 环绕子智能体节点 -->
  <circle cx="230" cy="150" r="14" fill="#0f172a" stroke="#06b6d4" stroke-width="2" filter="url(#glow)" />
  <circle cx="230" cy="150" r="5" fill="#38bdf8" />
  
  <circle cx="570" cy="150" r="14" fill="#0f172a" stroke="#ec4899" stroke-width="2" filter="url(#glow)" />
  <circle cx="570" cy="150" r="5" fill="#f472b6" />

  <circle cx="260" cy="310" r="12" fill="#0f172a" stroke="#a855f7" stroke-width="2" filter="url(#glow)" />
  <circle cx="540" cy="310" r="12" fill="#0f172a" stroke="#3b82f6" stroke-width="2" filter="url(#glow)" />

  <!-- 连线 -->
  <line x1="230" y1="150" x2="360" y2="205" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
  <line x1="570" y1="150" x2="440" y2="205" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
  <line x1="260" y1="310" x2="365" y2="245" stroke="#a855f7" stroke-width="1.5" opacity="0.5"/>
  <line x1="540" y1="310" x2="435" y2="245" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>

  <!-- 浮动文字标签 -->
  <text x="400" y="340" font-family="'JetBrains Mono', Consolas, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#e0e7ff" letter-spacing="4">AGENTIC WORKFLOW</text>
  <text x="400" y="365" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" text-anchor="middle" fill="#94a3b8" letter-spacing="1">感知 · 规划 · 执行 · 自我反思</text>
</svg>
