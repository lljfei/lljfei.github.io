<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgDev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#121824" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glowDev">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgDev)" />

  <!-- 极客终端窗口卡片 -->
  <g transform="translate(180, 70)">
    <!-- 窗口阴影与主体 -->
    <rect width="440" height="230" rx="14" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" filter="url(#glowDev)" />
    
    <!-- macOS 窗口三色按钮 -->
    <circle cx="22" cy="18" r="5" fill="#ef4444" />
    <circle cx="38" cy="18" r="5" fill="#f59e0b" />
    <circle cx="54" cy="18" r="5" fill="#10b981" />
    <line x1="0" y1="36" x2="440" y2="36" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- 终端代码内容 -->
    <text x="24" y="70" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" fill="#38bdf8" font-weight="600">➜  <tspan fill="#ec4899">~/workspace</tspan> <tspan fill="#a855f7">git:(</tspan><tspan fill="#10b981">main</tspan><tspan fill="#a855f7">)</tspan></text>
    <text x="24" y="102" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" fill="#f1f5f9">starship init powershell | Invoke-Expression</text>
    
    <text x="24" y="140" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" fill="#38bdf8" font-weight="600">➜  <tspan fill="#ec4899">~/workspace</tspan> <tspan fill="#10b981">code . --efficiency-mode</tspan></text>
    <text x="24" y="172" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#10b981">✔ Loaded 24 extensions | 0 errors | 60fps ✨</text>

    <!-- 光标 -->
    <rect x="24" y="190" width="8" height="15" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- 底部标题 -->
  <text x="400" y="350" font-family="'JetBrains Mono', Consolas, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#e0e7ff" letter-spacing="4">DEVELOPER TOOLKIT &amp; WORKFLOW</text>
  <text x="400" y="378" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle" fill="#94a3b8" letter-spacing="1">VS Code 深度定制 · 终端美化 · 命令行自动化</text>
</svg>
