<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgHello" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b14" />
      <stop offset="50%" stop-color="#161233" />
      <stop offset="100%" stop-color="#2d124d" />
    </linearGradient>
    <linearGradient id="auroraSky" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glowHello">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgHello)" />

  <!-- 极光光带波浪 -->
  <path d="M 0 160 C 200 80, 400 240, 800 120 L 800 0 L 0 0 Z" fill="url(#auroraSky)" opacity="0.3" filter="url(#glowHello)" />
  <path d="M 0 200 C 300 120, 500 260, 800 160 L 800 0 L 0 0 Z" fill="url(#auroraSky)" opacity="0.2" filter="url(#glowHello)" />

  <!-- 群星闪烁 -->
  <circle cx="120" cy="70" r="1.5" fill="#fff" opacity="0.8" />
  <circle cx="280" cy="50" r="2" fill="#fff" opacity="0.9" filter="url(#glowHello)" />
  <circle cx="450" cy="90" r="1.5" fill="#fff" opacity="0.7" />
  <circle cx="680" cy="60" r="2" fill="#fff" opacity="0.9" filter="url(#glowHello)" />
  <circle cx="730" cy="110" r="1" fill="#fff" opacity="0.6" />

  <!-- 几何山峦脉络 -->
  <polygon points="0,450 180,240 360,450" fill="#0f172a" opacity="0.8" />
  <polygon points="240,450 440,200 640,450" fill="#1e1b4b" opacity="0.9" />
  <polygon points="500,450 680,260 800,450" fill="#0f172a" opacity="0.8" />

  <!-- 山顶科技光标 -->
  <circle cx="440" cy="200" r="6" fill="#38bdf8" filter="url(#glowHello)" />
  <circle cx="440" cy="200" r="2" fill="#ffffff" />

  <!-- 底部标题 -->
  <text x="400" y="340" font-family="'JetBrains Mono', Consolas, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#e0e7ff" letter-spacing="4">HELLO, WORLD! 🚀</text>
  <text x="400" y="368" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle" fill="#94a3b8" letter-spacing="1">保持热爱，奔赴山海 · 李神的小站正式上线</text>
</svg>
