<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgMd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="50%" stop-color="#141824" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="mdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glowMd">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgMd)" />

  <!-- Markdown 标志符号阵列卡片 -->
  <g transform="translate(250, 80)">
    <rect width="300" height="200" rx="16" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="2" filter="url(#glowMd)" />
    
    <!-- 经典的 Markdown 图标 -->
    <path d="M 50 60 L 50 140 L 80 140 L 105 100 L 130 140 L 160 140 L 160 60 L 135 60 L 135 110 L 105 75 L 75 110 L 75 60 Z" fill="url(#mdGrad)" filter="url(#glowMd)" />
    <path d="M 215 60 L 215 110 L 195 110 L 230 145 L 265 110 L 245 110 L 245 60 Z" fill="url(#mdGrad)" filter="url(#glowMd)" />
  </g>

  <!-- 浮动排版符号 -->
  <text x="160" y="150" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="900" fill="#6366f1" opacity="0.7"># H1</text>
  <text x="140" y="240" font-family="'JetBrains Mono', monospace" font-size="26" font-weight="900" fill="#ec4899" opacity="0.6">**Bold**</text>
  <text x="640" y="150" font-family="'JetBrains Mono', monospace" font-size="26" font-weight="900" fill="#10b981" opacity="0.7">&gt; Quote</text>
  <text x="630" y="240" font-family="'JetBrains Mono', monospace" font-size="26" font-weight="900" fill="#38bdf8" opacity="0.6">`Code`</text>

  <!-- 底部标题 -->
  <text x="400" y="340" font-family="'JetBrains Mono', Consolas, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#e0e7ff" letter-spacing="4">MARKDOWN CHEATSHEET</text>
  <text x="400" y="368" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle" fill="#94a3b8" letter-spacing="1">优雅排版 · 公式渲染 · 代码高亮速查</text>
</svg>
