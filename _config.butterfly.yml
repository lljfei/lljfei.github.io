# ============================================================
# Butterfly 主题配置（李神的小站定制）
# 本文件会覆盖主题默认配置 node_modules/hexo-theme-butterfly/_config.yml
# 完整可配置项与文档: https://butterfly.js.org/
# ============================================================

# ---------------- 导航栏 ----------------
nav:
  logo: /img/avatar.svg
  display_title: true
  display_post_title: true
  fixed: false

menu:
  首页: / || fas fa-home
  时间轴: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  友链: /link/ || fas fa-link
  关于李神: /about/ || fas fa-heart

# ---------------- 主题色（与头像渐变呼应） ----------------
theme_color:
  enable: true
  main: "#c28b32"
  paginator: "#c84b36"
  button_hover: "#e5b75e"
  text_selection: "#c28b32"
  link_color: "#a66f1e"
  meta_color: "#756f64"
  hr_color: "#c28b32"
  code_foreground: "#c84b36"
  code_background: "rgba(194, 139, 50, .08)"
  toc_color: "#c28b32"
  blockquote_padding_color: "#c28b32"
  blockquote_background_color: "rgba(194, 139, 50, .08)"
  scrollbar_color: "#c28b32"
  meta_theme_color_light: "#f4f0e8"
  meta_theme_color_dark: "#11100e"

# ---------------- 社交链接（替换为你的真实地址） ----------------
social:
  fab fa-github: https://github.com/lljfei || GitHub || '#24292e'
  fas fa-rss: /atom.xml || RSS || '#ffa500'

# ---------------- 头像 / 图标 ----------------
favicon: /img/avatar.svg

avatar:
  img: /img/avatar.svg
  effect: false

# ---------------- 顶部横幅（渐变色，无需图片） ----------------
disable_top_img: false
default_top_img: "linear-gradient(120deg, #15120f 0%, #201a14 48%, #0e1816 100%)"
index_img: "linear-gradient(120deg, #15120f 0%, #201a14 48%, #0e1816 100%)"
index_top_img_height: 680px
index_site_info_top: 50%

# ---------------- 首页副标题打字机效果 ----------------
subtitle:
  enable: true
  effect: true
  typed_option:
    typeSpeed: 62
    backSpeed: 28
    loop: true
  source: false
  sub:
    - 你好，我是李神
    - 保持热爱，奔赴山海
    - 记录技术、思考与生活
    - 在代码与世界之间保持好奇

# ---------------- 首页内容布局 ----------------
index_layout: 3
index_post_content:
  method: 2
  length: 160
cover:
  index_enable: false
  aside_enable: true
  archives_enable: false

# ---------------- 代码块 ----------------
code_blocks:
  theme: darker
  macStyle: true
  height_limit: false
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: false

# ---------------- 文章 ----------------
post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

related_post:
  enable: true
  limit: 6
  date_type: created

# ---------------- 侧边栏 ----------------
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 保持热爱，奔赴山海
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/lljfei
  card_announcement:
    enable: true
    content: 欢迎来到李神的小站
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_newest_comments:
    enable: false
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 40
    color: false
    orderby: name
    order: 1
  card_archives:
    enable: true
    type: monthly
    format: YYYY年MM月
    order: -1
    limit: 8
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true

# ---------------- 页脚 ----------------
footer:
  owner:
    enable: true
    since: 2026
  copyright:
    enable: true
    version: false
  custom_text: '<div class="footer-editorial-mark"><span class="footer-editorial-kicker">FIELD NOTES / LISHEN</span><strong>保持热爱，奔赴山海。</strong><span class="footer-editorial-status"><i></i> SYSTEM ONLINE</span></div><div class="footer-nav"><a href="/"><span>首页</span></a><span>/</span><a href="/archives/"><span>时间轴</span></a><span>/</span><a href="/categories/"><span>分类</span></a><span>/</span><a href="/tags/"><span>标签</span></a><span>/</span><a href="/link/"><span>友链</span></a><span>/</span><a href="/about/"><span>关于李神</span></a><span>/</span><a href="https://github.com/lljfei" target="_blank" rel="noopener noreferrer"><span>GitHub</span></a></div><div id="footer-runtime-clock" class="footer-runtime-box">站点稳定运行计算中...</div>'

# ---------------- 暗色模式 ----------------
darkmode:
  enable: true
  button: true
  autoChangeMode: 1

# ---------------- 本地搜索（依赖 hexo-generator-searchdb） ----------------
search:
  use: local_search
  placeholder: 搜索文章
  local_search:
    preload: true
    top_n_per_article: 1
    unescape: true

# ---------------- 复制版权 ----------------
copy:
  enable: true
  copyright:
    enable: true
    limit_count: 150

# ---------------- 404 页面 ----------------
error_404:
  enable: true
  subtitle: 页面去哪儿了？

# ---------------- 数学公式（按文章加载） ----------------
# 需要公式的文章在 front-matter 中加 katex: true
math:
  use: katex
  per_page: false
  katex:
    copy_tex: true

# ---------------- Mermaid 流程图 ----------------
mermaid:
  enable: true
  code_write: true
  zoom_pan: false

# ---------------- 图片灯箱 ----------------
lightbox: fancybox

# ---------------- UI 系统注入 ----------------
rounded_corners_ui: false
inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">
  bottom:
    - <script src="/js/custom.js"></script>

# ---------------- 搜索引擎站长平台验证 ----------------
# 获取各平台验证码后取消注释并填入 content 即可：
# site_verification:
#   - name: google-site-verification
#     content: YOUR_GOOGLE_CONSOLE_CODE
#   - name: msvalidate.01
#     content: YOUR_BING_VERIFICATION_CODE
#   - name: baidu-site-verification
#     content: YOUR_BAIDU_CODE
