<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgPkm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0a14" />
      <stop offset="50%" stop-color="#18132b" />
      <stop offset="100%" stop-color="#2a0845" />
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glowPkm">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgPkm)" />

  <!-- 神经元网络与卡片盒双链网格 -->
  <!-- 核心思考节点 -->
  <g transform="translate(400, 170)">
    <!-- 旋转知识光环 -->
    <circle r="70" fill="none" stroke="url(#brainGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />
    <circle r="50" fill="rgba(168,85,247,0.15)" stroke="url(#brainGrad)" stroke-width="2" filter="url(#glowPkm)" />
    
    <!-- 晶体知识立方 -->
    <polygon points="0,-25 22,-12 22,12 0,25 -22,12 -22,-12" fill="url(#brainGrad)" opacity="0.9" />
    <text x="0" y="6" font-family="'JetBrains Mono', Consolas, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">PKM</text>
  </g>

  <!-- 四大 CODE 步骤节点 -->
  <!-- Capture -->
  <g transform="translate(220, 110)">
    <circle r="26" fill="#131127" stroke="#38bdf8" stroke-width="2" filter="url(#glowPkm)" />
    <text x="0" y="5" font-family="'JetBrains Mono', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">CAPTURE</text>
  </g>

  <!-- Organize -->
  <g transform="translate(580, 110)">
    <circle r="26" fill="#131127" stroke="#a855f7" stroke-width="2" filter="url(#glowPkm)" />
    <text x="0" y="5" font-family="'JetBrains Mono', sans-serif" font-size="12" font-weight="700" fill="#c084fc" text-anchor="middle">ORGANIZE</text>
  </g>

  <!-- Distill -->
  <g transform="translate(220, 240)">
    <circle r="26" fill="#131127" stroke="#ec4899" stroke-width="2" filter="url(#glowPkm)" />
    <text x="0" y="5" font-family="'JetBrains Mono', sans-serif" font-size="12" font-weight="700" fill="#f472b6" text-anchor="middle">DISTILL</text>
  </g>

  <!-- Express -->
  <g transform="translate(580, 240)">
    <circle r="26" fill="#131127" stroke="#f59e0b" stroke-width="2" filter="url(#glowPkm)" />
    <text x="0" y="5" font-family="'JetBrains Mono', sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">EXPRESS</text>
  </g>

  <!-- 连接光纤 -->
  <line x1="245" y1="120" x2="350" y2="155" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <line x1="555" y1="120" x2="450" y2="155" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <line x1="245" y1="230" x2="350" y2="185" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <line x1="555" y1="230" x2="450" y2="185" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- 底部标题 -->
  <text x="400" y="345" font-family="'JetBrains Mono', Consolas, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#e0e7ff" letter-spacing="4">PERSONAL KNOWLEDGE MANAGEMENT</text>
  <text x="400" y="372" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle" fill="#94a3b8" letter-spacing="1">输入 · 沉淀 · 表达 · 持续复利</text>
</svg>
