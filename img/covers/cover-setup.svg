<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgHexo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0c1e3d" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>
    <linearGradient id="hexoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glowHexo">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgHexo)" />

  <!-- 蝴蝶与六边形几何结合 -->
  <g transform="translate(400, 170)">
    <!-- 旋转科技六边形 -->
    <polygon points="0,-75 65,-37 65,37 0,75 -65,37 -65,-37" fill="none" stroke="url(#hexoGrad)" stroke-width="2.5" filter="url(#glowHexo)" />
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="rgba(14,165,233,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />

    <!-- 蝴蝶翅膀光效几何 -->
    <path d="M 0 0 C -40 -60 -80 -20 -45 20 C -20 40 0 10 0 0" fill="url(#hexoGrad)" opacity="0.8" filter="url(#glowHexo)" />
    <path d="M 0 0 C 40 -60 80 -20 45 20 C 20 40 0 10 0 0" fill="url(#hexoGrad)" opacity="0.8" filter="url(#glowHexo)" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" filter="url(#glowHexo)" />
  </g>

  <!-- 部署流向指示 -->
  <g transform="translate(180, 170)">
    <circle r="28" fill="#0f172a" stroke="#0ea5e9" stroke-width="2" filter="url(#glowHexo)" />
    <text x="0" y="5" font-family="'JetBrains Mono', sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">HEXO</text>
  </g>
  <line x1="215" y1="170" x2="320" y2="170" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="6 4" />

  <g transform="translate(620, 170)">
    <circle r="28" fill="#0f172a" stroke="#a855f7" stroke-width="2" filter="url(#glowHexo)" />
    <text x="0" y="5" font-family="'JetBrains Mono', sans-serif" font-size="13" font-weight="700" fill="#c084fc" text-anchor="middle">PAGES</text>
  </g>
  <line x1="480" y1="170" x2="585" y2="170" stroke="#a855f7" stroke-width="2" stroke-dasharray="6 4" />

  <!-- 底部标题 -->
  <text x="400" y="340" font-family="'JetBrains Mono', Consolas, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#e0e7ff" letter-spacing="4">HEXO + BUTTERFLY + GITHUB PAGES</text>
  <text x="400" y="368" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" text-anchor="middle" fill="#94a3b8" letter-spacing="1">纯静态架构 · 自动化持续部署 · 极致轻量</text>
</svg>
